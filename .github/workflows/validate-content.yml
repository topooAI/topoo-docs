name: Validate Agent Content Submission

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: content-contract-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout content candidate
        uses: actions/checkout@v4
        with:
          path: content

      - name: Checkout documentation system
        uses: actions/checkout@v4
        with:
          repository: topooAI/topoodoc
          ref: main
          path: system

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: system/pnpm-lock.yaml

      - name: Validate content model JSON
        working-directory: content
        run: |
          jq empty \
            content-model/boards.json \
            content-model/blocks.json \
            content-model/topics.json \
            content-model/pages.json \
            content/docs/meta.json

      - name: Install documentation system
        working-directory: system
        run: pnpm install --frozen-lockfile

      - name: Build integrated documentation candidate
        working-directory: system
        env:
          TOPOODOC_CONTENT_REPO: ${{ github.workspace }}/content
        run: pnpm content:build
